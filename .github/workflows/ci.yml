name: CI

# Runs on every push and every pull request. A pipeline that only runs on main is a
# pipeline that tells you about breakage after it is already merged.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run: no point burning minutes on
# a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      # One failing combination should not hide the results of the others.
      fail-fast: false
      matrix:
        # 21 is what we develop on; 25 is the next LTS. Building on both is how you
        # find out about a coming incompatibility months before it forces your hand.
        java: [21, 25]

    # The integration tests need a real PostgreSQL and Redis. Service containers give
    # us exactly that, reachable on localhost — the same contract the local
    # docker-compose provides, which is why no test code changes between the two.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtside_test
          POSTGRES_USER: courtside
          POSTGRES_PASSWORD: courtside
        ports:
          - 5432:5432
        # Without a health check the job would race the database and fail randomly.
        options: >-
          --health-cmd "pg_isready -U courtside -d courtside_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          # Caches ~/.m2 keyed on the pom files: dependencies are downloaded once,
          # not on every run. This is usually the single biggest CI speed-up.
          cache: maven

      - name: Build, test and verify
        working-directory: backend
        # `verify` runs BOTH phases: surefire (unit + slice) then failsafe (integration).
        # -B batch mode = no ANSI noise in the log; -ntp hides transfer spam.
        run: ./mvnw -B -ntp verify
        env:
          # The integration profile reads these; defaults point at docker-compose
          # locally, and here at the service containers above.
          TEST_DB_URL: jdbc:postgresql://localhost:5432/courtside_test
          TEST_DB_USER: courtside
          TEST_DB_PASSWORD: courtside
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379

      # Uploaded even when the build fails — that is precisely when you need to read
      # the reports. `if: always()` is the difference between a useful pipeline and a
      # red X with no explanation.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always() && matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches the npm download cache rather than node_modules: restoring a
          # node_modules tree across operating systems is unreliable, and `npm ci`
          # rebuilds it correctly from the lockfile anyway.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Build BEFORE test. The test run compiles the same sources, so building
      # first turns a TypeScript error into one clear failure instead of two
      # confusing ones.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # No backend service here on purpose. The build prerenders /clubs, which
      # calls the API through a relative URL that the prerender server cannot
      # resolve, so ClubListComponent's catchError renders the empty state and
      # the build succeeds. Standing up Postgres and Redis here would make the
      # frontend pipeline depend on infrastructure it does not actually need.

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    # A separate job from the unit tests because these need the whole stack up:
    # a real database with the seed migrations, Redis, the API and the Angular dev
    # server. That is exactly what `npm test` cannot give you.
    services:
      postgres:
        # The DATABASE name, not just the user: this is the schema the app itself
        # migrates and seeds, so the suite sees the same six demo clubs you get
        # locally from docker-compose.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtside
          POSTGRES_USER: courtside
          POSTGRES_PASSWORD: courtside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courtside -d courtside"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # application.yml points at port 5433 because that is what docker-compose
      # publishes on a machine that already runs a native PostgreSQL on 5432.
      # The service container owns 5432 here, so override rather than edit the
      # committed config — the local experience stays untouched.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/courtside
      SPRING_DATASOURCE_USERNAME: courtside
      SPRING_DATASOURCE_PASSWORD: courtside

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No tests here: they already ran in the Java job. Package only, so this
      # job is not doing the same work twice while it waits.
      - name: Build the API jar
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      # Backgrounded with output captured. Left on stdout the process would hold
      # the step open forever, since the runner waits for every pipe to close.
      - name: Start the API
        run: |
          nohup java -jar backend/target/courtside-api-*.jar > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      # --retry-all-errors makes curl treat connection refusals as retryable, so
      # this waits for Spring to actually come up instead of racing it.
      - name: Wait for the API
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/actuator/health
          echo " API is up"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only Chromium: the other four projects (firefox, webkit, two mobile) are
      # not part of this gate, and downloading every engine roughly triples the
      # install time for coverage nothing asserts on.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright's own webServer block starts `ng serve` on :4200 and shuts it
      # down again, so there is no separate step to manage the frontend here.
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test --project=chromium

      # The html report is the useful artifact and it only exists when something
      # went wrong — on a green run there is nothing to read.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Dump the API log
        if: failure()
        run: tail -n 200 /tmp/api.log || true

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    # Only build an image out of code that passed every test. Ordering jobs this way
    # makes "green pipeline" mean something.
    needs: [build-and-test, frontend, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: courtside-api:${{ github.sha }}
          # Cache layers between runs so an unchanged dependency layer is not rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max
