spring:
  application:
    name: courtside-api

  datasource:
    # Matches docker-compose. In prod these come from environment variables, never from git.
    # Port 5433: the compose container is published there to avoid a clash with the
    # native PostgreSQL service installed on this machine (which owns 5432).
    url: jdbc:postgresql://localhost:5433/courtside
    username: courtside
    password: courtside

  jpa:
    hibernate:
      # NEVER let Hibernate create/update the schema. Flyway owns the schema;
      # 'validate' makes Hibernate check that entities and tables agree at startup
      # and fail fast if they drift.
      ddl-auto: validate
    # Open Session In View keeps the DB session open while rendering responses,
    # which silently "fixes" lazy-loading bugs you should actually fix. Off, always.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true # scans classpath:db/migration for V*__*.sql at startup

  servlet:
    multipart:
      # Ceiling for a club photo. Enforced by the multipart resolver while the
      # request is still being parsed, so an oversized upload never reaches a
      # controller — it surfaces as 413 via GlobalExceptionHandler instead of
      # filling memory first. ClubService checks the same number again.
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: localhost
      port: 6379
      # Fail fast instead of hanging a request for 60s when Redis is down.
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
    # Uncomment to see every SQL statement Hibernate runs (your N+1 detector):
    # org.hibernate.SQL: DEBUG
app:
  jwt:
    # ${ENV_VAR:default} -> use the JWT_SECRET environment variable when present
    # (production), otherwise fall back to this dev-only value (>= 32 bytes for HMAC).
    secret: ${JWT_SECRET:courtside-dev-only-secret-do-not-use-in-prod-0123456789}
  refresh:
    # Refresh-token lifetime. Short access token (15 min, in JwtService) + long refresh
    # token = security without logging the user out every quarter of an hour.
    expiration-days: 7
  # Clubs publish wall-clock opening hours; this zone turns them into absolute instants.
  timezone: Africa/Tunis
  booking:
    # Members may cancel freely until this many hours before the start.
    cancel-hours-before: 2
    # Payment window: a HOLD blocks the slot for this long, then is released.
    hold-minutes: 10
    # Reminders are sent this long before the start.
    reminder-hours-before: 24
  jobs:
    # Overridable so tests/demos can run them far more often than production.
    hold-release-ms: 60000
    reminder-cron: "0 0 * * * *"      # hourly, on the hour
    waitlist-cleanup-cron: "0 30 3 * * *"  # 03:30 nightly
