# Public entry point for the production stack. The browser talks to ONE origin,
# exactly like the dev-server proxy does locally (frontend/proxy.conf.json), so
# CORS never applies in production either.
server {
    listen 80;
    server_name _;

    # Matches the backend multipart ceiling so an oversized club photo is rejected
    # with a clean 413 instead of being cut off mid-upload by nginx.
    client_max_body_size 6m;

    # ---- REST API -> Spring Boot ----
    # No trailing slash on proxy_pass: the full path (/api/v1/...) is forwarded.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- STOMP over WebSocket (SockJS) -> Spring Boot ----
    # The Upgrade/Connection headers are what actually turn this into a WebSocket;
    # without them the socket never opens and availability updates silently stop.
    # Long read timeout: a live availability subscription is idle most of the time.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Everything else -> the Angular SSR server ----
    # Only the real Host and the client IP are forwarded. No X-Forwarded-* headers:
    # the SSR runtime strips unknown proxy headers (SSRF protection) and logs a
    # warning for every one of them, and the app builds no absolute URLs anyway.
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
